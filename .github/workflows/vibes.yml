name: Vibes Scraper Auto Update

on:
  schedule:
    - cron: '0 */12 * * *'  # Har 12 soatda avtomatik ishlaydi
  workflow_dispatch:        # Istalgancha qo'lda ham ishga tushirish imkoni

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Code-ni yuklash
        uses: actions/checkout@v4

      - name: Python sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxona va Playwright-ni o'rnatish
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Skreypingni ishga tushirish
        run: python scraper.py

      - name: Yangilangan JSON-ni GitHub-ga saqlash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vibes_data.json
          git commit -m "Auto-update vibes_data.json" || exit 0
          git push
